name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel a PR's in-progress run when a newer commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build examples
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Each directory with a package.json is an example. Its build type checks
      # and bundles it, without calling any API.
      - name: Install and build each example
        run: |
          for pkg in */package.json; do
            dir=$(dirname "$pkg")
            echo "::group::$dir"
            pnpm -C "$dir" install --frozen-lockfile
            pnpm -C "$dir" build
            echo "::endgroup::"
          done
